name: Earnings after-hours watch

on:
  schedule:
    # Fires every 5 minutes across the after-close window rather than once.
    # The script no longer sleeps on the runner: runs before
    # EARNINGS_AMC_REMINDER_TIME_ET (15:00 ET) exit immediately, runs from
    # then on send the "reports after close today" reminder, and runs at or
    # after EARNINGS_AMC_POLL_START_ET (16:00 ET) make one detection pass
    # each, with progress kept in state.json.
    #
    # 19:00-23:55 UTC spans 15:00-19:55 ET in EDT. In EST that shifts an
    # hour earlier (14:00-18:55 ET), so the tail of a very late release
    # could fall outside the window -- the give-up notice would then arrive
    # on the next weekday run rather than the same evening. Acceptable
    # trade-off versus running the job around the clock.
    - cron: "*/5 19-23 * * 1-5"
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Run in --test mode (skips the window guard, short poll timeout)"
        type: boolean
        default: false

# Shared with monitor.yml and telegram_commands.yml. Safe to join now that
# this job finishes in seconds instead of sleeping for hours -- while it
# held a runner it would have blocked the one-minute pollers behind it.
concurrency:
  group: stock-alert-agent-repo-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  afterhours-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run after-hours earnings watch
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          if [ "${{ inputs.test_mode }}" = "true" ]; then
            python earnings_watch.py afterhours_watch --test
          else
            python earnings_watch.py afterhours_watch
          fi

      - name: Commit updated state
        run: |
          git config user.name "stock-agent-bot"
          git config user.email "actions@github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update earnings watch state [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Push succeeded."
              exit 0
            fi
            echo "Push rejected (attempt $i/5) -- fetching and rebasing before retry."
            git fetch origin main
            git rebase origin/main
            sleep $(( (RANDOM % 5) + 1 ))
          done
          echo "Push failed after retries."
          exit 1
