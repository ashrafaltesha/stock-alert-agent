name: Telegram ticker commands

on:
  schedule:
    # A fresh listener every hour. Each holds an open long-poll connection to
    # Telegram for 62 minutes -- LONGER than the interval -- so the incoming
    # run overlaps the outgoing one instead of leaving a gap on the hour.
    #
    # This replaces the old */5 cron plus an external cron-job.org trigger
    # every 2 minutes. THAT EXTERNAL TRIGGER MUST BE TURNED OFF: with
    # cancel-in-progress below, every dispatch kills the running listener and
    # starts a new one, so a 2-minute trigger would mean a ~30s blind spot
    # every 2 minutes -- worse than what it replaced.
    - cron: "0 * * * *"
  workflow_dispatch: {}

# This workflow gets its own group, NOT one shared with monitor.yml.
#
# They used to share "stock-alert-agent-repo-write". Once both ran at ~1
# minute, roughly two runs a minute were arriving into a lane that serves one
# at a time, each taking 30-60s. The queue never drained and GitHub cancelled
# 163 runs to clear it: "Canceling since a higher priority waiting request
# for stock-alert-agent-repo-write exists".
#
# That is precisely how the duplicate replies happened. A run sends its reply
# around the 40s mark but doesn't record the update as handled until the
# commit step at ~60s. Cancelled in between, the reply went out and nothing
# was written down, so the next run answered the same message again. Note
# these show as "cancelled", not "failed" -- filtering the run list by
# failures hides them completely.
#
# A separate group stops monitor.yml interrupting this one.
#
# cancel-in-progress is now TRUE, the opposite of before, and for a reason
# that only applies to the listener design: Telegram permits exactly ONE open
# getUpdates connection per bot. A second poller gets a 409 and the two start
# stealing each other's messages. Queueing runs would guarantee that overlap;
# cancelling means the newest listener always wins, which also makes a wedged
# job self-healing.
#
# The old duplicate-reply risk that made cancellation dangerous is gone:
# messages are now acknowledged to Telegram immediately after the reply is
# sent, not recorded by a git push twenty seconds later.
concurrency:
  group: stock-alert-agent-telegram
  cancel-in-progress: true

permissions:
  contents: write
  # Lets the bot start the earnings watcher when you text
  # "earnings for X" -- the watcher exits when idle, so something
  # has to wake it.
  actions: write

jobs:
  process-commands:
    runs-on: ubuntu-latest
    # 330-minute loop plus headroom, against GitHub's 6-hour job cap. A
    # wedged job is still cleared within the hour by the next cron, since
    # this workflow cancels in progress.
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4

      # holdings.json lives in a separate private repo (stock-alert-agent-data)
      # so this repo can be public without exposing share counts / cost basis.
      # Checked out here into data/, alongside a PAT scoped only to that repo.
      - uses: actions/checkout@v4
        with:
          repository: ashrafaltesha/stock-alert-agent-data
          token: ${{ secrets.DATA_REPO_PAT }}
          path: data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # ~13s per run reinstalling identical packages, ~290 runs a day.
          # yfinance drags in pandas and numpy; lxml is a compiled wheel.
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Listen for Telegram commands
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEALTHCHECK_PING_KEY: ${{ secrets.HEALTHCHECK_PING_KEY }}
          # "earnings for TICKER" runs the CATCH-UP in this workflow, which
          # can send a full earnings alert. Without these the figures could
          # not be extracted here even though the same code works elsewhere:
          # the capability travelled with the code, the configuration did not.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Without this, a 5.5-hour job's stdout sits in a block buffer and
          # the log stays EMPTY until the process exits. On 2026-08-27 the
          # watcher ran 3h14m and had printed 10 lines -- all of them the env
          # header -- which made it impossible to see what it was doing while
          # it mattered.
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        # "listen" loops on a long-poll connection. Without the argument
        # this still runs the old one-shot path, which is what a manual
        # `python telegram_commands.py` does locally.
        run: python telegram_commands.py listen

      - name: Commit updated tickers/watchlist/state
        run: |
          git config user.name "stock-agent-bot"
          git config user.email "actions@github.com"
          git add tickers.json watchlist.json state.json cik_map.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update tickers/watchlist/state via Telegram command [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Push succeeded."
              exit 0
            fi
            echo "Push rejected (attempt $i/5) -- merging state by key before retry."
            # NOT a rebase. monitor.yml rewrites the whole of state.json every
            # minute, so replaying this commit conflicts on every line, every
            # time. Merge the data instead: take origin/main, then re-apply
            # only what this run changed since the commit it started from --
            # crucially including DELETIONS, so a resolved ew_watch:: entry
            # stays deleted rather than reviving into a repeat earnings alert.
            #
            # tickers.json and watchlist.json are written only by this
            # workflow, so ours are kept wholesale; state.json is the one both
            # sides touch and the only one that needs a real merge.
            git fetch origin main
            BASE=$(git merge-base HEAD origin/main)
            git show "$BASE":state.json     > /tmp/base.json   2>/dev/null || echo '{}' > /tmp/base.json
            git show origin/main:state.json > /tmp/theirs.json 2>/dev/null || echo '{}' > /tmp/theirs.json
            git show HEAD:state.json        > /tmp/ours.json
            git show HEAD:tickers.json      > /tmp/tickers.json
            git show HEAD:watchlist.json    > /tmp/watchlist.json
            git reset --hard origin/main
            cp /tmp/tickers.json tickers.json
            cp /tmp/watchlist.json watchlist.json
            python merge_state.py --base /tmp/base.json --ours /tmp/ours.json \
                                  --theirs /tmp/theirs.json --out state.json
            git add tickers.json watchlist.json state.json cik_map.json
            if git diff --cached --quiet; then
              echo "Nothing left to commit after merge -- the other run covered it."
              exit 0
            fi
            git commit -m "Update tickers/watchlist/state via Telegram command [skip ci]"
            sleep $(( (RANDOM % 5) + 1 ))
          done
          echo "Push failed after retries."
          exit 1

      - name: Commit updated holdings (private data repo)
        working-directory: data
        run: |
          git config user.name "stock-agent-bot"
          git config user.email "actions@github.com"
          git add holdings.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update holdings via Telegram command [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Push succeeded."
              exit 0
            fi
            echo "Push rejected (attempt $i/5) -- fetching and rebasing before retry."
            git fetch origin main
            git rebase origin/main
            sleep $(( (RANDOM % 5) + 1 ))
          done
          echo "Push failed after retries."
          exit 1
