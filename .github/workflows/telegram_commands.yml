name: Telegram ticker commands

on:
  schedule:
    # Every 5 minutes. GitHub Actions doesn't guarantee this runs exactly
    # on time -- expect it to sometimes lag a few minutes, more on busy
    # days -- so treat this as "checked roughly every few minutes," not
    # real-time.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  process-commands:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Process Telegram ticker commands
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python telegram_commands.py

      - name: Commit updated tickers/holdings/watchlist/state
        run: |
          git config user.name "stock-agent-bot"
          git config user.email "actions@github.com"
          git add tickers.json holdings.json watchlist.json state.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update tickers/holdings/watchlist/state via Telegram command [skip ci]"
          # This runs every ~5 min alongside monitor.yml, which also pushes to
          # main -- without retrying, whichever job loses the race gets its
          # push rejected and its update (e.g. a ticker you just added to
          # your watchlist) is silently dropped. Retry with a rebase onto the
          # latest main a few times before giving up.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Push succeeded."
              exit 0
            fi
            echo "Push rejected (attempt $i/5) -- fetching and rebasing before retry."
            git fetch origin main
            git rebase origin/main
            sleep $(( (RANDOM % 5) + 1 ))
          done
          echo "Push failed after retries."
          exit 1
