name: Telegram ticker commands

on:
  schedule:
    # Every 5 minutes. GitHub Actions doesn't guarantee this runs exactly
    # on time -- expect it to sometimes lag a few minutes, more on busy
    # days -- so treat this as "checked roughly every few minutes," not
    # real-time.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

# Shared with monitor.yml's concurrency group (same name there) so GitHub
# queues one run behind the other instead of letting them race to push to
# main at the same time. cancel-in-progress stays false so a queued run
# still executes once the earlier one finishes, rather than being dropped --
# runs only take ~20-30s, so a queued run adds at most that much delay.
concurrency:
  group: stock-alert-agent-repo-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  process-commands:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Process Telegram ticker commands
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python telegram_commands.py

      - name: Commit updated tickers/holdings/watchlist/state
        run: |
          git config user.name "stock-agent-bot"
          git config user.email "actions@github.com"
          git add tickers.json holdings.json watchlist.json state.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update tickers/holdings/watchlist/state via Telegram command [skip ci]"
          # Belt-and-suspenders: the concurrency group above should mean
          # monitor.yml is never running at the same time, so this loop
          # should rarely if ever actually retry. Kept as a backstop.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Push succeeded."
              exit 0
            fi
            echo "Push rejected (attempt $i/5) -- fetching and rebasing before retry."
            git fetch origin main
            git rebase origin/main
            sleep $(( (RANDOM % 5) + 1 ))
          done
          echo "Push failed after retries."
          exit 1
