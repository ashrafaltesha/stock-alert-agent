name: Tests

# Runs on pushes that touch code or the tests themselves, and on demand.
# Deliberately NOT on the state.json commits the bot makes every minute --
# those are data, not code, and would otherwise trigger this constantly.
on:
  push:
    paths:
      - "**.py"
      - "requirements.txt"
      - ".github/workflows/tests.yml"
  workflow_dispatch: {}

# No repo writes here, so this intentionally stays out of the
# stock-alert-agent-repo-write concurrency group.

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # ~13s per run reinstalling identical packages, ~290 runs a day.
          # yfinance drags in pandas and numpy; lxml is a compiled wheel.
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: python -m pytest tests/ -q
