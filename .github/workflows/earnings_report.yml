name: Daily earnings report

on:
  schedule:
    # ~5:30pm ET / 21:30 UTC (EST) or 22:30 UTC (EDT) - set for EST here;
    # adjust by 1 hour if you want it precise during daylight saving time.
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}

jobs:
  earnings-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run earnings report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python earnings_report.py
