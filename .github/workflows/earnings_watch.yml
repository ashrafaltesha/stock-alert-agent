name: Earnings watch (SEC filings)

# Replaces earnings_bmo_reminder.yml, earnings_watch_premarket.yml and
# earnings_watch_afterhours.yml, which polled Finnhub's epsActual on a
# fixed schedule and detected releases hours late, or not at all.
#
# TWO jobs, deliberately:
#
#   arm   -- cheap, twice a day. Asks the calendar which holdings report
#            today or tomorrow and creates the watch records.
#   watch -- one long-running job per hour that polls SEC filings every 15
#            seconds for whatever is armed.
#
# The long job is the point. The old design started a fresh run per poll and
# spent 45-100 seconds provisioning a machine and installing yfinance to do
# 2 seconds of work -- so polling faster just repeated the overhead. Paying
# startup once an hour instead takes detection from 90-150s down to ~15s.
#
# No poll windows. Measured across 40 foreign issuers and 166 domestic
# filings, earnings land anywhere from 06:00 to 17:23 ET: Itau 09:50, Shell
# 10:02, Ericsson 10:14, HSBC 11:46, Vale 12:08 all sit in the gap the old
# 06:00-09:00 / 16:00-18:00 windows left open, and Tesla's 09:01-09:20
# filings fell just past the morning cutoff. The windows were an optimisation
# for a cost that no longer exists.

on:
  schedule:
    # EVENING, EVERY DAY. This is the one that matters: it arms tomorrow's
    # reporters the night before, so a Monday pre-market filer is armed on
    # Sunday rather than depending on a Monday morning run that has to land
    # before the company files. It runs seven days a week for exactly that
    # reason -- a weekday-only arm leaves Monday with no margin at all.
    - cron: "37 22 * * *"
    # MORNING BACKUP, weekdays. 08:37 UTC is 04:37 ET, ahead of the earliest
    # filing time ever measured (SAP 06:00 ET).
    #
    # Deliberately not on the hour. Scheduled runs are queued best-effort and
    # :00 is the most contended minute on the platform; the 09:00 UTC run on
    # 2026-08-24 did not start until 10:57 UTC, by which point XPeng had
    # already filed at 06:46 ET. An odd minute is not a guarantee, which is
    # why arm() now also reports anything already filed today.
    - cron: "37 8 * * 1-5"
    # A fresh watcher every hour, at :07 rather than :05 for the same
    # contention reason. Each loops for 62 minutes -- LONGER than the
    # interval -- so the incoming run overlaps the outgoing one instead of
    # leaving a gap at the top of the hour.
    #
    # 09:00-23:00 UTC = 05:00-19:00 ET in summer, 04:00-18:00 in winter.
    # It starts an hour before the earliest filing measured (SAP 06:00 ET,
    # TSMC and Honda 06:02) and runs past the latest (Novo 17:23). The
    # previous 10:00 UTC start put first cover at 06:05 ET -- five minutes
    # after SAP files.
    - cron: "7 9-23 * * 1-5"
  workflow_dispatch: {}

# NO workflow-level concurrency. The two jobs need opposite settings, and
# putting them in one lane was a real outage.
#
# It used to be a single group with cancel-in-progress: true. The arm job
# ends by dispatching the watcher -- so the run it started landed in its own
# lane and cancelled it, mid-job, before the commit step. Deterministically,
# every time arming succeeded. On 2026-08-24 the Telegram heads-up for XPEV
# went out and state.json never recorded the watch; the watcher found nothing
# armed and exited in four seconds. Cancelled runs show as "cancelled", not
# "failed", so the Actions list looked clean.
#
# Each job now declares its own group below.

permissions:
  contents: write
  # The arm job dispatches the watch job below.
  actions: write

jobs:
  arm:
    if: github.event.schedule == '37 22 * * *' || github.event.schedule == '37 8 * * 1-5'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Its own lane, and it must NOT cancel in progress. Arming sends Telegram
    # messages and records watches; a half-finished arm is the one state that
    # looks fine and isn't.
    concurrency:
      group: stock-alert-agent-earnings-arm
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # ~13s per run reinstalling identical packages, ~290 runs a day.
          # yfinance drags in pandas and numpy; lxml is a compiled wheel.
          cache: pip
      # Arming needs the calendar, which needs requests. Only this job pays
      # for dependencies; the watcher below deliberately does not.
      - run: pip install -r requirements.txt
      - name: Arm watches
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEALTHCHECK_PING_KEY: ${{ secrets.HEALTHCHECK_PING_KEY }}
        run: python earnings_watch.py arm
      - name: Commit state
        run: |
          git config user.name "stock-agent-bot"
          git config user.email "actions@github.com"
          git add state.json cik_map.json
          git diff --cached --quiet && exit 0
          git commit -m "Arm earnings watches [skip ci]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            git fetch origin main
            BASE=$(git merge-base HEAD origin/main)
            git show "$BASE":state.json     > /tmp/base.json   2>/dev/null || echo '{}' > /tmp/base.json
            git show origin/main:state.json > /tmp/theirs.json 2>/dev/null || echo '{}' > /tmp/theirs.json
            git show HEAD:state.json        > /tmp/ours.json
            git reset --hard origin/main
            python merge_state.py --base /tmp/base.json --ours /tmp/ours.json \
                                  --theirs /tmp/theirs.json --out state.json
            git add state.json cik_map.json
            git diff --cached --quiet && exit 0
            git commit -m "Arm earnings watches [skip ci]"
            sleep $(( (RANDOM % 5) + 1 ))
          done
          exit 1

  watch:
    # workflow_dispatch has no schedule, so this also covers a watcher
    # started on demand by the arm job or the Telegram command.
    if: github.event.schedule != '37 22 * * *' && github.event.schedule != '37 8 * * 1-5'
    runs-on: ubuntu-latest
    # Separate lane from arm, and this one DOES cancel in progress: each
    # hour's watcher should replace the last rather than queue behind it,
    # which also makes a hung job self-healing.
    concurrency:
      group: stock-alert-agent-earnings-watch
      cancel-in-progress: true
    # 330-minute loop plus headroom, against GitHub's 6-hour job cap. An
    # idle watcher still exits in seconds; this ceiling only applies when
    # something is actually armed.
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4

      # NO setup-python and NO pip install, on purpose. Ubuntu runners ship
      # with Python, and sec_edgar.py uses only the standard library. That
      # removes 25-55 seconds from startup -- which was the single largest
      # component of the old detection latency.

      - name: Watch SEC filings
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Either key enables structured extraction of the release. With
          # neither, the alert still goes out -- it just quotes the company's
          # own highlights instead of listing parsed metrics.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HEALTHCHECK_PING_KEY: ${{ secrets.HEALTHCHECK_PING_KEY }}
        run: python3 earnings_watch.py poll

      # State is committed once, after the loop. Committing on every
      # detection would mean a git push inside the hot path, and pushes take
      # longer than the poll interval itself.
      - name: Commit state
        if: always()
        run: |
          git config user.name "stock-agent-bot"
          git config user.email "actions@github.com"
          git add state.json cik_map.json
          git diff --cached --quiet && exit 0
          git commit -m "Update earnings watch state [skip ci]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            git fetch origin main
            BASE=$(git merge-base HEAD origin/main)
            git show "$BASE":state.json     > /tmp/base.json   2>/dev/null || echo '{}' > /tmp/base.json
            git show origin/main:state.json > /tmp/theirs.json 2>/dev/null || echo '{}' > /tmp/theirs.json
            git show HEAD:state.json        > /tmp/ours.json
            git reset --hard origin/main
            python3 merge_state.py --base /tmp/base.json --ours /tmp/ours.json \
                                   --theirs /tmp/theirs.json --out state.json
            git add state.json cik_map.json
            git diff --cached --quiet && exit 0
            git commit -m "Update earnings watch state [skip ci]"
            sleep $(( (RANDOM % 5) + 1 ))
          done
          exit 1
