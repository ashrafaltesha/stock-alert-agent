name: Replay an SEC filing (manual)

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: "Ticker to replay (e.g. XPEV)"
        required: true
        default: "XPEV"
      accession:
        description: "Specific accession, or blank for the newest earnings filing"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # ~13s per run reinstalling identical packages, ~290 runs a day.
          # yfinance drags in pandas and numpy; lxml is a compiled wheel.
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run simulation
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          # replay exercises the real extraction path, so it needs the same
          # model key the watcher uses -- without it the figures are blank
          # and the replay proves less than it looks like it does.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # simulate -> earnings_watch -> workflow_trigger can dispatch.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python simulate.py replay "${{ github.event.inputs.ticker }}" "${{ github.event.inputs.accession }}"
