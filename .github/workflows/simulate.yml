name: Backtest simulation (manual)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        required: true
        default: "replay"
        type: choice
        options: ["replay", "backtest"]
      ticker:
        description: "replay: ticker to replay (e.g. XPEV)"
        required: false
        default: "XPEV"
      accession:
        description: "replay: specific accession, blank = newest earnings filing"
        required: false
        default: ""
      sim_date:
        description: "backtest: date to simulate (YYYY-MM-DD)"
        required: false
        default: "2026-08-07"

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run simulation
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          # replay exercises the real extraction path, so it needs the same
          # model key the watcher uses -- without it the figures are blank
          # and the replay proves less than it looks like it does.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "backtest" ]; then
            python simulate.py "${{ github.event.inputs.sim_date }}"
          else
            python simulate.py replay "${{ github.event.inputs.ticker }}" "${{ github.event.inputs.accession }}"
          fi
