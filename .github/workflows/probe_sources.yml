name: Probe earnings sources (temporary)

# Reachability check only. Manual, sends nothing, writes nothing.
# Delete with probe_sources.py once the source design is settled.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Probe sources
        run: python probe_sources.py
