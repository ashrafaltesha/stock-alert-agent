name: Earnings BMO day-before reminder

on:
  schedule:
    # Fires every 10 minutes across the early-evening window rather than
    # once. The script no longer sleeps to reach
    # EARNINGS_BMO_REMINDER_TIME_ET (18:00 ET) -- earlier runs exit
    # immediately, and the first run at or after 18:00 ET sends the
    # reminder. A per-ticker state key stops it repeating on later runs.
    # 22:00-23:50 UTC covers 18:00-19:50 ET in EDT and 17:00-18:50 ET in
    # EST, so the 18:00 ET mark is reached year-round.
    # Weekdays only -- checks TOMORROW's before-open reporters.
    - cron: "*/10 22-23 * * 1-5"
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Run in --test mode (skips the window guard)"
        type: boolean
        default: false

# Shared with the other repo writers so state.json commits can't race.
concurrency:
  group: stock-alert-agent-repo-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bmo-reminder:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run BMO day-before reminder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          if [ "${{ inputs.test_mode }}" = "true" ]; then
            python earnings_watch.py bmo_reminder --test
          else
            python earnings_watch.py bmo_reminder
          fi

      - name: Commit updated state
        run: |
          git config user.name "stock-agent-bot"
          git config user.email "actions@github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update earnings reminder state [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Push succeeded."
              exit 0
            fi
            echo "Push rejected (attempt $i/5) -- fetching and rebasing before retry."
            git fetch origin main
            git rebase origin/main
            sleep $(( (RANDOM % 5) + 1 ))
          done
          echo "Push failed after retries."
          exit 1
