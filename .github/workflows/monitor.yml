name: Stock price & news monitor

on:
  schedule:
    # Every 5 minutes, roughly 9:00am-4:15pm ET (13:00-20:15 UTC), weekdays:
    # full check (prices + material news). Covers both EST and EDT with
    # some slack; the script itself checks real market hours in
    # America/New_York and only runs price checks when actually open.
    # Note: GitHub's scheduled runs aren't guaranteed to fire exactly on
    # time -- under high platform load they can be delayed by a few
    # minutes, more noticeable at this tighter interval than at 15 min.
    - cron: "*/5 13-20 * * 1-5"
    # Hourly, every day/hour: material-news-only check for the rest of the
    # time (pre-market, after-hours, weekends). This overlaps with the
    # 5-min schedule once an hour during market hours too -- harmless,
    # since dedup prevents any duplicate alerts, just a few redundant runs.
    - cron: "0 * * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Commit updated state
        run: |
          git config user.name "stock-agent-bot"
          git config user.email "actions@github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Update alert state [skip ci]"
          git push
