name: Stock price & news monitor

on:
  schedule:
    # Every 5 minutes, roughly 9:00am-4:15pm ET (13:00-20:15 UTC), weekdays:
    # full check (prices + material news). Covers both EST and EDT with
    # some slack; the script itself checks real market hours in
    # America/New_York and only runs price checks when actually open.
    # Note: GitHub's scheduled runs aren't guaranteed to fire exactly on
    # time -- under high platform load they can be delayed by a few
    # minutes, more noticeable at this tighter interval than at 15 min.
    - cron: "*/5 13-20 * * 1-5"
    # Hourly, every day/hour: material-news-only check for the rest of the
    # time (pre-market, after-hours, weekends). This overlaps with the
    # 5-min schedule once an hour during market hours too -- harmless,
    # since dedup prevents any duplicate alerts, just a few redundant runs.
    - cron: "0 * * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

# This workflow gets its own group, NOT one shared with telegram_commands.yml.
#
# They used to share "stock-alert-agent-repo-write" so they'd take turns
# writing state.json. That worked until both moved to ~1-minute cadences:
# roughly two runs a minute arriving into a lane that serves one at a time,
# each taking 30-60s. The queue could never drain, and GitHub started
# cancelling runs to clear it -- 163 of them, with the message "Canceling
# since a higher priority waiting request for stock-alert-agent-repo-write
# exists".
#
# That was the source of the duplicate Telegram replies: a cancelled run had
# already sent its reply but was killed before the commit step recorded the
# update as handled, so the next run answered the same message again.
#
# Separate groups mean the two workflows can now push concurrently and one
# will lose the race. That is handled in the commit step below by merging
# state.json by key instead of rebasing (see merge_state.py) -- a rebase can
# never succeed here, since both sides rewrite every line of the same file.
concurrency:
  group: stock-alert-agent-monitor
  cancel-in-progress: false

permissions:
  contents: write
  # Lets this workflow restart the Telegram listener when GitHub's
  # scheduler has dropped it. See ensure_listener_running().
  actions: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # ~13s per run reinstalling identical packages, ~290 runs a day.
          # yfinance drags in pandas and numpy; lxml is a compiled wheel.
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Reachable through the import graph (health -> earnings_utils ->
          # config). Not called today, but "not called today" is exactly what
          # was true of the listener's model key until the catch-up was added.
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          # Dead-man's switch. Absent secret = silently disabled.
          HEALTHCHECK_PING_KEY: ${{ secrets.HEALTHCHECK_PING_KEY }}
          # News screening. One batched call per run -- a handful a day, well
          # inside either free tier. With NEITHER key set the run still works:
          # news_filter falls back to the old keyword match, which is noisier
          # but is the previous behaviour rather than a regression.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python monitor.py

      - name: Commit updated state
        run: |
          git config user.name "stock-agent-bot"
          git config user.email "actions@github.com"
          git add state.json cik_map.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update alert state [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Push succeeded."
              exit 0
            fi
            echo "Push rejected (attempt $i/5) -- merging state by key before retry."
            # NOT a rebase. telegram_commands.yml rewrites the whole of
            # state.json too, so replaying this commit conflicts on every
            # line, every time. Merge the data instead: take what's on
            # origin/main, then re-apply only what this run changed relative
            # to the commit it started from.
            git fetch origin main
            BASE=$(git merge-base HEAD origin/main)
            git show "$BASE":state.json          > /tmp/base.json   2>/dev/null || echo '{}' > /tmp/base.json
            git show origin/main:state.json      > /tmp/theirs.json 2>/dev/null || echo '{}' > /tmp/theirs.json
            git show HEAD:state.json             > /tmp/ours.json
            git reset --hard origin/main
            python merge_state.py --base /tmp/base.json --ours /tmp/ours.json \
                                  --theirs /tmp/theirs.json --out state.json
            git add state.json cik_map.json
            if git diff --cached --quiet; then
              echo "Nothing left to commit after merge -- the other run covered it."
              exit 0
            fi
            git commit -m "Update alert state [skip ci]"
            sleep $(( (RANDOM % 5) + 1 ))
          done
          echo "Push failed after retries."
          exit 1
